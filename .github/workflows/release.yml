name: Build and Release
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq unzip zip openssl
      - run: go test -race -tags with_quic,with_utls ./... github.com/sagernet/fswatch
      # Vision's upstream unsafe TLS access and shared filter state are not race-clean.
      - run: go test -tags with_quic,with_utls ./core -run TestVLESSRealityVision -count=1
      - run: go vet -tags with_quic,with_utls ./...
      - run: bash -n script/install.sh && bash -n script/v2box.sh
      - run: python3 -m unittest discover -s script -p '*_test.py'
  build:
    needs: test
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: |
          mkdir -p build_assets
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          go build -tags with_quic,with_utls -trimpath -ldflags "-s -w -X github.com/lenaanderson5566-ops/v2box/cmd.version=${GITHUB_REF_NAME}" -o "build_assets/v2box${suffix}" .
          cp README.md LICENSE LICENSE.sing-box NOTICE.md config.example.json build_assets/
          cp script/install.sh script/v2box.sh script/node-network.py script/node-credentials.py build_assets/
          cp -r internal/licenses build_assets/
          cd build_assets
          zip -r "../v2box-${GOOS}-${GOARCH}.zip" .
          cd ..
          sha256sum "v2box-${GOOS}-${GOARCH}.zip" > "v2box-${GOOS}-${GOARCH}.zip.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: v2box-${{ matrix.goos }}-${{ matrix.goarch }}
          path: v2box-*.zip*
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: v2box-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete release assets
        shell: bash
        run: |
          cd release-assets
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              test -s "v2box-${os}-${arch}.zip"
              test -s "v2box-${os}-${arch}.zip.sha256"
              sha256sum -c "v2box-${os}-${arch}.zip.sha256"
              listing=$(unzip -Z1 "v2box-${os}-${arch}.zip")
              grep -Fxq node-credentials.py <<< "$listing"
              grep -Fxq install.sh <<< "$listing"
              grep -Fxq v2box.sh <<< "$listing"
              grep -Fxq node-network.py <<< "$listing"
            done
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/v2box-*.zip*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            V2Box v1.0.12：单实例多后台与独立节点部署。

            - 按后台/节点独立启动、重试和重载，保留其他节点长连接。
            - 支持能力探测、SIGHUP 局部重载和多目标 IP 上报。
            - 后台一键部署按身份追加 Nodes，保留既有节点、证书、上报和 DNS。
            - 部署授权与恢复状态分开保存，完成回执避免重复消耗一次性授权。

            - AnyTLS 关闭时取消待完成拨号，拒绝并释放迟到连接。
            - 配置验证失败、重载及关闭后释放面板空闲 HTTP 连接。
            - 最终流量上报使用持久化批次，避免重复恢复已保留计量。
            - 配置和服务文件完整写入后再替换，写入失败可重试；移除重复 IP 探测。
            - 修复定时任务非法参数和超时计算溢出。
            - 保留现有配置、证书、部署状态和 DNS 记录；启动失败仍自动回滚。

            面板通过 update.sh 更新后，一键安装与恢复使用 v1.0.12。
            现有节点执行 /usr/local/bin/v2box update v1.0.12；不指定版本时获取最新正式版。
            旧管理命令缺少 update 时，下载本版本 script/install.sh，执行 bash install.sh v1.0.12 --update。
            服务原本停止时升级不会启动，请完成部署或执行 v2box start。
            提供六个平台/架构安装包及 SHA-256；服务管理脚本适用于 Linux。
