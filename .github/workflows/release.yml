name: Build and Release
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -tags with_quic,with_utls ./...
      # Vision's upstream unsafe TLS access and shared filter state are not race-clean.
      - run: go test -tags with_quic,with_utls ./core -run TestVLESSRealityVision -count=1
      - run: go vet -tags with_quic,with_utls ./...
      - run: bash -n script/install.sh && bash -n script/v2box.sh
      - run: python3 -m unittest discover -s script -p '*_test.py'
  build:
    needs: test
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: |
          mkdir -p build_assets
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          go build -tags with_quic,with_utls -trimpath -ldflags "-s -w -X github.com/lenaanderson5566-ops/v2box/cmd.version=${GITHUB_REF_NAME}" -o "build_assets/v2box${suffix}" .
          cp README.md LICENSE LICENSE.sing-box NOTICE.md config.example.json build_assets/
          cp script/install.sh script/v2box.sh script/node-network.py script/node-credentials.py build_assets/
          cp -r internal/licenses build_assets/
          cd build_assets
          zip -r "../v2box-${GOOS}-${GOARCH}.zip" .
          cd ..
          sha256sum "v2box-${GOOS}-${GOARCH}.zip" > "v2box-${GOOS}-${GOARCH}.zip.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: v2box-${{ matrix.goos }}-${{ matrix.goarch }}
          path: v2box-*.zip*
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: v2box-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete release assets
        shell: bash
        run: |
          cd release-assets
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              test -s "v2box-${os}-${arch}.zip"
              test -s "v2box-${os}-${arch}.zip.sha256"
              sha256sum -c "v2box-${os}-${arch}.zip.sha256"
              listing=$(unzip -Z1 "v2box-${os}-${arch}.zip")
              grep -Fxq node-credentials.py <<< "$listing"
              grep -Fxq install.sh <<< "$listing"
              grep -Fxq v2box.sh <<< "$listing"
              grep -Fxq node-network.py <<< "$listing"
            done
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/v2box-*.zip*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            V2Box v1.0.6。请先更新面板，再升级节点。

            - 发布尚未包含在 v1.0.5 中的节点生命周期与证书部署修复。
            - 增加 v2box update 与 v2box uninstall，支持 systemd 和 OpenRC；更新失败恢复旧程序，保留配置与证书。
            - 卸载默认保留独立 IP 上报，--stop-network 可明确停用共享上报调度。
            - 改进证书申请默认配置，验证协议、监听端口、证书及直连/中转设置重载。
            - 中转连接地址与 TLS 身份独立管理，不要求入口域名替换落地证书。
            - 提供 Linux/macOS/Windows 的 amd64、arm64 安装包及逐包 SHA-256 校验文件；服务管理脚本适用于 Linux。

            旧版命令脚本不支持 update 时，请下载本版本 script/install.sh，运行 bash install.sh v1.0.6 --update。
            更新保留 /etc/v2box/config.json 和证书。升级重启可能中断已有连接。
            面板部署 DNS 故障切换由面板 bootstrap 提供，请更新面板并重新下载脚本后恢复部署。
