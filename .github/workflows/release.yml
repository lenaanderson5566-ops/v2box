name: Build and Release
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq unzip zip openssl
      - run: go test -race -tags with_quic,with_utls ./... github.com/sagernet/fswatch
      # Vision's upstream unsafe TLS access and shared filter state are not race-clean.
      - run: go test -tags with_quic,with_utls ./core -run TestVLESSRealityVision -count=1
      - run: go vet -tags with_quic,with_utls ./...
      - run: bash -n script/install.sh && bash -n script/v2box.sh
      - run: python3 -m unittest discover -s script -p '*_test.py'
  build:
    needs: test
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir=$PWD
          package_root=$(mktemp -d)
          trap 'rm -rf -- "$package_root"' EXIT
          mkdir "$package_root/package"
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          go build -tags with_quic,with_utls -trimpath -ldflags "-s -w -X github.com/lenaanderson5566-ops/v2box/cmd.version=${GITHUB_REF_NAME}" -o "$package_root/package/v2box${suffix}" .
          cp README.md LICENSE LICENSE.sing-box NOTICE.md config.example.json "$package_root/package/"
          cp script/install.sh script/v2box.sh script/node-network.py script/node-credentials.py "$package_root/package/"
          cp -r internal/licenses "$package_root/package/"
          cd "$package_root/package"
          zip -r "../v2box-${GOOS}-${GOARCH}.zip" .
          cd "$artifact_dir"
          mv -f "$package_root/v2box-${GOOS}-${GOARCH}.zip" .
          sha256sum "v2box-${GOOS}-${GOARCH}.zip" > "v2box-${GOOS}-${GOARCH}.zip.sha256"
          sha256sum -c "v2box-${GOOS}-${GOARCH}.zip.sha256"
          unzip -tq "v2box-${GOOS}-${GOARCH}.zip"
          listing=$(unzip -Z1 "v2box-${GOOS}-${GOARCH}.zip")
          for file in "v2box${suffix}" README.md LICENSE LICENSE.sing-box NOTICE.md config.example.json install.sh v2box.sh node-network.py node-credentials.py; do
            grep -Fxq "$file" <<< "$listing"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: v2box-${{ matrix.goos }}-${{ matrix.goarch }}
          path: v2box-*.zip*
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: v2box-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete release assets
        shell: bash
        run: |
          cd release-assets
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              test -s "v2box-${os}-${arch}.zip"
              test -s "v2box-${os}-${arch}.zip.sha256"
              sha256sum -c "v2box-${os}-${arch}.zip.sha256"
              listing=$(unzip -Z1 "v2box-${os}-${arch}.zip")
              grep -Fxq node-credentials.py <<< "$listing"
              grep -Fxq install.sh <<< "$listing"
              grep -Fxq v2box.sh <<< "$listing"
              grep -Fxq node-network.py <<< "$listing"
            done
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/v2box-*.zip*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            V2Box v1.0.18：安装维护恢复与访问地址统计修复。

            - 下载、验包、解压、依赖与服务操作有期限；中断时清理子进程并回滚旧程序，保留恢复备份。
            - 启停、重载与维护操作互斥，检查实际服务状态，拒绝启动示例接入配置。
            - 兼容 v1.0.16 已安装的旧升级器：仅在直接父安装事务确实持有三把独占锁时委托内部重启，普通锁冲突仍明确拒绝。
            - IP 上报忙锁立即退出，定时任务和交互有期限，程序文件原子替换并保留权限。
            - TUIC、Hysteria2 访问统计使用实际请求目标，避免将本地监听地址记为 0.0.0.0；保留透明代理原始目标语义。
            - TUIC 连接对象保留实际 QUIC 对端地址，在线登记拒绝无效和未指定 IP。
            - 旧部署助手缺少锁委托能力时明确提示更新面板并重新下载恢复引导，保留部署状态。
            - 保留现有 Nodes、证书、密钥、IP 上报设置；运行中的服务升级后重启，停止的服务保持停止。

            先更新配套面板，再执行 v2box update 或 v2box update v1.0.18。未完成的部署应从更新后的面板重新下载引导并使用 --resume。
            旧管理入口不支持 update 时，下载本版本 script/install.sh，执行 bash install.sh v1.0.18 --update。
            OpenRC/Alpine 同样要求 GNU coreutils timeout；缺依赖时先运行面板最新引导修复。
