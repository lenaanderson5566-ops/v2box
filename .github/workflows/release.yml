name: Build and Release
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -tags with_quic,with_utls ./...
      # Vision's upstream unsafe TLS access and shared filter state are not race-clean.
      - run: go test -tags with_quic,with_utls ./core -run TestVLESSRealityVision -count=1
      - run: go vet -tags with_quic,with_utls ./...
      - run: bash -n script/install.sh && bash -n script/v2box.sh
      - run: python3 -m unittest discover -s script -p '*_test.py'
  build:
    needs: test
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: |
          mkdir -p build_assets
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          go build -tags with_quic,with_utls -trimpath -ldflags "-s -w -X github.com/lenaanderson5566-ops/v2box/cmd.version=${GITHUB_REF_NAME}" -o "build_assets/v2box${suffix}" .
          cp README.md LICENSE LICENSE.sing-box NOTICE.md config.example.json build_assets/
          cp script/install.sh script/v2box.sh script/node-network.py script/node-credentials.py build_assets/
          cp -r internal/licenses build_assets/
          cd build_assets
          zip -r "../v2box-${GOOS}-${GOARCH}.zip" .
          cd ..
          sha256sum "v2box-${GOOS}-${GOARCH}.zip" > "v2box-${GOOS}-${GOARCH}.zip.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: v2box-${{ matrix.goos }}-${{ matrix.goarch }}
          path: v2box-*.zip*
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: v2box-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete release assets
        shell: bash
        run: |
          cd release-assets
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              test -s "v2box-${os}-${arch}.zip"
              test -s "v2box-${os}-${arch}.zip.sha256"
              sha256sum -c "v2box-${os}-${arch}.zip.sha256"
              listing=$(unzip -Z1 "v2box-${os}-${arch}.zip")
              grep -Fxq node-credentials.py <<< "$listing"
              grep -Fxq install.sh <<< "$listing"
            done
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/v2box-*.zip*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            V2Box v1.0.5。请先更新面板，再升级节点。

            - 修复代理将 ETag 改为弱标签或移除后，域名切换出现 invalid configuration hash 并回退的问题。
            - 优先使用面板响应正文中的配置哈希，同时兼容旧面板的强、弱 ETag；不自行猜测或重算配置版本。
            - 缺失或无效的配置哈希在准备证书、停止旧监听之前拒绝，保留正在运行的节点。
            - 保留 certificate-transition-v1：验证公网 DNS、新证书及监听启动成功后，再由面板发布新域名。
            - 普通 TLS 同步连接域名、SNI 与证书域名；Reality 身份保持独立。
            - 验证失败保留旧配置，监听切换失败恢复原监听、用户与流量预算；旧证书文件保留。
            - 增加操作 ID、证书指纹和面板确认，重复确认有界重试，完成后避免重复重载。
            - 保留独立 IP 上报辅助脚本，支持面板生成的一次性配置与修复命令。
            - 提供 Linux/macOS/Windows 的 amd64、arm64 安装包及逐包 SHA-256 校验文件。

            升级保留 /etc/v2box/config.json。重载或升级可能中断已有连接；域名启用后客户端需要更新订阅。
            手动证书必须覆盖目标域名并具备可信证书链。此版本不包含离线启动或断联授权缓冲功能。
